{%load static%}
<form  method="POST" enctype="multipart/form-data" action="{% url 'administrator:edit-service' i.id %}">
    {% csrf_token %}
      <div class="offcanvas-inner-body pt-0">
        <div class="form-default">
          <div class="form-body">
            <div class="row">
                <div class="col-12">
                    <label class="form-label">Title</label>
                    <input type="text" value="{{i.title|default_if_none:""}}" class="form-control" name="title" placeholder="Enter Title" required >
                </div>
               
                
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" placeholder="Enter Description">{{i.description|default_if_none:''}}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Main Image</label>
                    <input type="file" class="form-control" name="main_image"  accept="image/*" />
                    {%if i.main_image%}
                    <div class="row mt-2">
                      <div class="col-md-4">
                          <img class="img-fluid" src="{{i.main_image.url}}"></img>
                      </div>
                    </div>
                    {%endif%}
                </div>   
              </div>
            
            
                
              </div>
              </div>
            </div>
          </div>
        </div>
      </div> 
      <div class="offcanvas-footer text-end">
        <button type="button" class="btn btn-secondary min-width-100-px m-r-15" data-bs-dismiss="offcanvas" aria-label="Close">Close</button>
        <button class="btn btn-l-green min-width-100-px">Update</button>
      </div>    
    </form>

{% block javascript %}
<script>


$('.default_ex_default_multi_field_wrapper').each(function () {
    var $wrapper = $('.ex-multi-fields', this);
    
    $('.ex-multi-field .ex_remove-field-btn', $wrapper).click(function () {
        $(this).parents('.ex-multi-field').remove();
    });
    
    
    
    });


// // multi_field_wrapper
$('.default_multi_field_wrapper').each(function () {
    var $wrapper = $('.multi-fields', this);
    $(".add-field-btn", $(this)).click(function (e) {
      $('.multi-field:first-child', $wrapper).clone(true).appendTo($wrapper).find('.multi-input').val('').focus();
      $($wrapper).find('.auto-complete-input').prop("readonly", true)
      $($wrapper).find('.auto-complete-input').last().prop("readonly", false)
    });
    $('.multi-field .remove-field-btn', $wrapper).click(function () {
      if ($('.multi-field', $wrapper).length > 1)
        $(this).parents('.multi-field').remove();
    });
  });
</script>
{% endblock %}
